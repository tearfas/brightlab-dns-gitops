name: PowerDNS Sync Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  dns-sync:
    runs-on: dns-gitops

    steps:
      - name: Checkout Code Base
        uses: actions/checkout@v4.2.2

      - name: Install Local Ansible Requirements
        run: |
          ansible-galaxy collection install community.general --force

      - name: Verify Configuration (Dry Run)
        if: github.event_name == 'pull_request'
        run: |
          ansible-playbook -i hosts.ini manage_pdns.yaml --check
        env:
          PDNS_API_URL: ${{ secrets.PDNS_API_URL }}
          PDNS_API_KEY: ${{ secrets.PDNS_API_KEY }}

      - name: Apply Live Records to PowerDNS Engine
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          ansible-playbook -i hosts.ini manage_pdns.yaml
        env:
          PDNS_API_URL: ${{ secrets.PDNS_API_URL }}
          PDNS_API_KEY: ${{ secrets.PDNS_API_KEY }}
