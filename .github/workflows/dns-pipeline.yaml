name: PowerDNS Sync Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  dns-sync:
    runs-on: dns-gitops

    steps:
      - name: Checkout Code Base
        uses: actions/checkout@v4.2.2

      # FORCE INSTALL VERSION 9.5.0 TO MATCH ANSIBLE 2.16.18 NATIVELY
      #- name: Install Local Ansible Requirements
      #  run: |
      #   ansible-galaxy collection install community.general:9.5.0 -p ./collections --force

      - name: Verify Configuration (Dry Run)
        if: github.event_name == 'pull_request'
        run: |
          ansible-playbook -i hosts.ini manage_pdns_via_api.yaml --check
        env:
          PDNS_API_URL: ${{ secrets.PDNS_API_URL }}
          PDNS_API_KEY: ${{ secrets.PDNS_API_KEY }}

      - name: Apply Live Records to PowerDNS Engine
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          ansible-playbook -i hosts.ini manage_pdns_via_api.yaml
        env:
          PDNS_API_URL: ${{ secrets.PDNS_API_URL }}
          PDNS_API_KEY: ${{ secrets.PDNS_API_KEY }}
